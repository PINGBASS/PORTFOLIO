<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>로딩 화면 예시</title>
  <style>
    /* 로딩 화면 스타일 */
    #loading {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(255, 255, 255, 0.8);
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 24px;
      font-weight: bold;
      color: #333;
      z-index: 9999; /* 최상단에 배치 */
    }

    #content {
      display: none; /* 초기에는 숨김 */
    }

    #loading img {
      width: 50px;
      height: 50px;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

  <!-- 로딩 화면 -->
  <div id="loading">
    <img src="spinner.gif" alt="로딩 애니메이션">
  </div>

  <!-- 콘텐츠 -->
  <div id="content">
    <h1>여기에 많은 이미지가 로드됩니다</h1>
    <img src="../img/1.png" alt="이미지 1">
    <img src="../img/6.png" alt="이미지 2">
  </div>

  <script>
    window.onload = function () {
      const contentImages = document.querySelectorAll("#content img"); // 로딩 화면 제외
      let loadedImagesCount = 0;

      function checkAllImagesLoaded() {
        if (loadedImagesCount === contentImages.length) {
          document.getElementById("loading").style.display = "none";  // 로딩 화면 숨기기
          document.getElementById("content").style.display = "block"; // 콘텐츠 표시
        }
      }

      // 모든 이미지 로드 확인
      contentImages.forEach((img) => {
        if (img.complete) {
          loadedImagesCount++;
        } else {
          img.onload = () => {
            loadedImagesCount++;
            checkAllImagesLoaded();
          };
          img.onerror = () => { // 이미지 로딩 실패 시에도 카운트 증가
            loadedImagesCount++;
            checkAllImagesLoaded();
          };
        }
      });

      // 1초 후에도 이미지 로드가 끝나지 않으면 강제 전환
      setTimeout(() => {
        checkAllImagesLoaded();
      }, 1000);
    };
  </script>

</body>
</html>
